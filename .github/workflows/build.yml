name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: macOS arm64
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j "$(sysctl -n hw.ncpu)"

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Package .app
        run: packaging/macos/make-app.sh build dist

      - name: Self test (boot, subscript, restart, update check)
        run: |
          "dist/Path of Building.app/Contents/MacOS/PathOfBuilding" \
            --data "$RUNNER_TEMP/pob-data" --user "$RUNNER_TEMP/pob-user" --check-boot
          echo "--- host.log"; tail -n 40 "$RUNNER_TEMP/pob-data/host.log"

      - name: Zip
        run: cd dist && ditto -c -k --keepParent "Path of Building.app" PathOfBuilding-macos-arm64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: PathOfBuilding-macos-arm64
          path: dist/PathOfBuilding-macos-arm64.zip
          if-no-files-found: error

  windows:
    name: Windows x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Ninja
        run: pip install ninja

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build

      - name: Unit tests
        run: ctest --test-dir build --output-on-failure

      - name: Check the exe needs no Visual C++ Redistributable
        shell: pwsh
        run: |
          $deps = dumpbin /nologo /dependents build/host/PathOfBuilding.exe | Out-String
          Write-Host $deps
          if ($deps -match '(?i)vcruntime|msvcp') { throw "PathOfBuilding.exe depends on the VC++ runtime DLLs" }

      - name: Package
        shell: pwsh
        run: packaging/windows/package.ps1 -Build build -Out dist

      - name: Self test (boot, subscript, restart, update check)
        shell: pwsh
        run: |
          $exe = "dist/PathOfBuilding-win64/PathOfBuilding.exe"
          $p = Start-Process -FilePath $exe -Wait -PassThru -NoNewWindow `
            -ArgumentList "--data", "$env:RUNNER_TEMP\pob-data", "--user", "$env:RUNNER_TEMP\pob-user", "--check-boot"
          Write-Host "--- host.log"
          Get-Content "$env:RUNNER_TEMP\pob-data\host.log" -Tail 40
          if ($p.ExitCode -ne 0) { throw "self test failed with exit code $($p.ExitCode)" }

      - name: Installer test (install, run, uninstall)
        shell: pwsh
        run: |
          $dir = "$env:RUNNER_TEMP\pob-install"
          $setup = Start-Process -FilePath dist/PathOfBuilding-Setup-win64.exe -Wait -PassThru -ArgumentList "/S", "/D=$dir"
          if ($setup.ExitCode -ne 0) { throw "setup failed: $($setup.ExitCode)" }
          if (-not (Test-Path "$dir\PathOfBuilding.exe")) { throw "exe not installed" }
          if (-not (Test-Path "$env:APPDATA\Microsoft\Windows\Start Menu\Programs\Path of Building (Native).lnk")) { throw "no Start menu shortcut" }
          $key = "HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\PathOfBuildingNative"
          Write-Host "Registered: $((Get-ItemProperty $key).DisplayName) $((Get-ItemProperty $key).DisplayVersion)"
          $p = Start-Process -FilePath "$dir\PathOfBuilding.exe" -Wait -PassThru -NoNewWindow `
            -ArgumentList "--data", "$env:RUNNER_TEMP\pob-data-installed", "--user", "$env:RUNNER_TEMP\pob-user", "--check-boot"
          if ($p.ExitCode -ne 0) { throw "installed app self test failed: $($p.ExitCode)" }
          $u = Start-Process -FilePath "$dir\Uninstall.exe" -Wait -PassThru -ArgumentList "/S", "_?=$dir"
          if (Test-Path "$dir\PathOfBuilding.exe") { throw "uninstall left the exe" }
          if (Test-Path $key) { throw "uninstall left the registry key" }
          Write-Host "Install, run and uninstall OK"

      - uses: actions/upload-artifact@v4
        with:
          name: PathOfBuilding-win64
          path: dist/PathOfBuilding-win64.zip
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        with:
          name: PathOfBuilding-Setup-win64
          path: dist/PathOfBuilding-Setup-win64.exe
          if-no-files-found: error

  release:
    name: Draft release
    # Tags like v0.1.0 create a draft release with both packages; publish it by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches the host version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          version="$(sed -n 's/^ *VERSION \([0-9.]*\)$/\1/p' CMakeLists.txt | head -1)"
          if [ "$TAG" != "v$version" ]; then
            echo "::error::Tag $TAG does not match project version $version in CMakeLists.txt"
            exit 1
          fi

      - name: Check the bundled PoB is PoB's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bundled="$(git ls-tree HEAD PathOfBuilding | awk '{print $3}')"
          latest="$(gh api repos/PathOfBuildingCommunity/PathOfBuilding/releases/latest --jq .tag_name)"
          # The commit the tag points at (the ^{} line for annotated tags).
          refs="$(git ls-remote https://github.com/PathOfBuildingCommunity/PathOfBuilding.git "refs/tags/$latest*")"
          latest_sha="$(echo "$refs" | awk -v t="refs/tags/$latest^{}" '$2 == t {print $1}')"
          [ -n "$latest_sha" ] || latest_sha="$(echo "$refs" | awk -v t="refs/tags/$latest" '$2 == t {print $1}')"
          if [ "$bundled" != "$latest_sha" ]; then
            echo "::error::The release bundles PoB $bundled, but PoB's latest release is $latest ($latest_sha). Run tools/update-pob.sh, commit, and tag again."
            exit 1
          fi
          echo "Bundled PoB is $latest"

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          # Version of the bundled PoB, from the submodule commit (not checked out here).
          pob_sha="$(git ls-tree HEAD PathOfBuilding | awk '{print $3}')"
          pob="$(curl -fsSL "https://raw.githubusercontent.com/PathOfBuildingCommunity/PathOfBuilding/$pob_sha/manifest.xml" \
            | sed -n 's/.*<Version number="\([^"]*\)".*/\1/p' | head -1)"
          sed -e "s/@TAG@/$TAG/g" -e "s/@POB_VERSION@/${pob:-unknown}/g" packaging/release-notes.md > notes.md
          gh release create "$TAG" --draft --verify-tag --title "Path of Building native $TAG" \
            --notes-file notes.md \
            artifacts/PathOfBuilding-Setup-win64.exe artifacts/PathOfBuilding-win64.zip \
            artifacts/PathOfBuilding-macos-arm64.zip
